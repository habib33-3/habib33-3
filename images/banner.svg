<svg width="800" height="160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>

    <!-- Tech Line Gradient -->
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7aa2f7;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#7aa2f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7aa2f7;stop-opacity:0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="160" fill="url(#bg)" rx="12"/>

  <!-- Animated Particles -->
  <circle cx="60" cy="40" r="2.5" fill="#7aa2f7" opacity="0.6">
    <animate attributeName="cy" values="40;30;40" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="60" r="3" fill="#bb9af7" opacity="0.5">
    <animate attributeName="cy" values="60;50;60" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="35" r="2.5" fill="#7dcfff" opacity="0.6">
    <animate attributeName="cy" values="35;45;35" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="55" r="2.5" fill="#9ece6a" opacity="0.5">
    <animate attributeName="cy" values="55;65;55" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Name -->
  <text x="30" y="50" font-family="monospace" font-size="26" font-weight="bold" fill="#c0caf5" filter="url(#glow)">
    Habibur Rahman
  </text>

  <!-- Role -->
  <text x="30" y="75" font-family="monospace" font-size="14" fill="#7aa2f7">
    &gt; Full-Stack Developer
  </text>

  <!-- Focus Areas -->
  <text x="30" y="95" font-family="monospace" font-size="12" fill="#bb9af7">
    &gt; Backend • TypeScript • Scalable Systems
  </text>

  <!-- Tech stack line -->
  <line x1="30" y1="115" x2="770" y2="115" stroke="url(#line)" stroke-width="2" opacity="0.7"/>

  <!-- Tech stack text -->
  <text x="30" y="135" font-family="monospace" font-size="11" fill="#565f89">
    [ Node.js | NestJS | Express | PostgreSQL | Prisma | Docker | React | Tailwind ]
  </text>

  <!-- Floating glow highlights -->
  <circle cx="400" cy="140" r="6" fill="#bb9af7" opacity="0.2">
    <animate attributeName="r" values="6;10;6" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="140" r="5" fill="#7aa2f7" opacity="0.2">
    <animate attributeName="r" values="5;8;5" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
