<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <clipPath id="clip">
      <rect width="900" height="200" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">

    <!-- Editor background -->
    <rect width="900" height="200" fill="#282c34"/>

    <!-- Top bar -->
    <rect width="900" height="32" fill="#21252b"/>

    <!-- Window controls -->
    <circle cx="18" cy="16" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="16" r="5" fill="#ffbd2e"/>
    <circle cx="54" cy="16" r="5" fill="#27c93f"/>

    <!-- Active tab -->
    <rect x="78" y="5" width="155" height="27" rx="4" fill="#282c34"/>

    <rect x="90" y="11" width="14" height="14" rx="2" fill="#3178c6"/>

    <text
      x="97"
      y="21.5"
      font-family="monospace"
      font-size="8"
      font-weight="bold"
      text-anchor="middle"
      fill="#ffffff"
    >TS</text>

    <text
      x="113"
      y="22"
      font-family="monospace"
      font-size="11"
      fill="#d7dae0"
    >engineer.ts</text>

    <circle cx="219" cy="18" r="2.5" fill="#d7dae0" opacity="0.6"/>

    <!-- Inactive tab -->
    <text
      x="250"
      y="22"
      font-family="monospace"
      font-size="11"
      fill="#636d83"
    >README.md</text>

    <!-- Gutter -->
    <rect y="32" width="48" height="142" fill="#2c313a"/>

    <!-- Line numbers -->
    <g
      font-family="monospace"
      font-size="11"
      fill="#5c6370"
      text-anchor="end"
    >
      <text x="37" y="53">1</text>
      <text x="37" y="74">2</text>
      <text x="37" y="95">3</text>
      <text x="37" y="116">4</text>
      <text x="37" y="137">5</text>
      <text x="37" y="158">6</text>
    </g>

    <!-- Code -->
    <g font-family="monospace" font-size="13">

      <text x="62" y="53" fill="#7f848e" font-style="italic">
        // backend developer
      </text>

      <text x="62" y="74">
        <tspan fill="#c678dd">const</tspan>
        <tspan fill="#e5c07b"> engineer</tspan>
        <tspan fill="#abb2bf"> = {</tspan>
      </text>

      <text x="62" y="95">
        <tspan fill="#56b6c2">  role</tspan>
        <tspan fill="#abb2bf">: </tspan>
        <tspan fill="#98c379">"Backend Developer"</tspan>
        <tspan fill="#abb2bf">,</tspan>
      </text>

      <text x="62" y="116">
        <tspan fill="#56b6c2">  stack</tspan>
        <tspan fill="#abb2bf">: [</tspan>
        <tspan fill="#98c379">"NestJS"</tspan>
        <tspan fill="#abb2bf">, </tspan>
        <tspan fill="#98c379">"Prisma"</tspan>
        <tspan fill="#abb2bf">, </tspan>
        <tspan fill="#98c379">"PostgreSQL"</tspan>
        <tspan fill="#abb2bf">],</tspan>
      </text>

      <text x="62" y="137">
        <tspan fill="#56b6c2">  focus</tspan>
        <tspan fill="#abb2bf">: </tspan>
        <tspan fill="#98c379">"scalable, secure systems"</tspan>
      </text>

      <text x="62" y="158" fill="#abb2bf">};</text>

    </g>

    <!-- Cursor -->
    <rect x="85" y="147" width="2" height="15" fill="#d7dae0">
      <animate
        attributeName="opacity"
        values="1;1;0;0"
        dur="1s"
        repeatCount="indefinite"
      />
    </rect>

    <!-- Status bar -->
    <rect y="174" width="900" height="26" fill="#252a31"/>

    <text
      x="14"
      y="191"
      font-family="monospace"
      font-size="11"
      fill="#abb2bf"
    >main</text>

    <text
      x="886"
      y="191"
      font-family="monospace"
      font-size="11"
      text-anchor="end"
      fill="#abb2bf"
    >TypeScript · UTF-8 · Spaces: 2</text>

  </g>
</svg>
